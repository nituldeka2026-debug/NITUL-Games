<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brain Puzzle - NITUL Games</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#111827;
    color:white;
    text-align:center;
}
.container{
    max-width:500px;
    margin:40px auto;
    padding:25px;
}
h1{color:#54e36b}
#question{
    font-size:24px;
    margin:30px 0;
}
.options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}
button{
    padding:18px;
    font-size:18px;
    border:0;
    border-radius:12px;
    cursor:pointer;
}
#score{
    font-size:20px;
    margin:20px;
}
</style>
</head>

<body>

<div class="container">

<h1>🧩 Brain Puzzle</h1>

<div id="score">Score: 0</div>

<div id="question"></div>

<div class="options">
<button onclick="answer(0)"></button>
<button onclick="answer(1)"></button>
<button onclick="answer(2)"></button>
<button onclick="answer(3)"></button>
</div>

</div>

<script>

const questions=[
{
q:"What is 5 + 7?",
a:["10","11","12","13"],
correct:2
},
{
q:"What comes next? 2, 4, 6, ?",
a:["7","8","9","10"],
correct:1
},
{
q:"Which planet is known as the Red Planet?",
a:["Earth","Mars","Venus","Jupiter"],
correct:1
},
{
q:"What is 10 × 5?",
a:["40","45","50","55"],
correct:2
},
{
q:"How many days are in one week?",
a:["5","6","7","8"],
correct:2
}
];

let current=0;
let score=0;

function loadQuestion(){

    if(current>=questions.length){
        document.body.innerHTML=`
        <div class="container">
        <h1>🎉 Game Complete!</h1>
        <h2>Your Score: ${score}/${questions.length}</h2>
        <button onclick="location.reload()">Play Again</button>
        </div>`;
        return;
    }

    const q=questions[current];

    document.getElementById("question").textContent=q.q;

    const buttons=document.querySelectorAll(".options button");

    buttons.forEach((b,i)=>{
        b.textContent=q.a[i];
    });
}

function answer(index){

    if(index===questions[current].correct){
        score++;
        alert("✅ Correct!");
    }else{
        alert("❌ Wrong answer!");
    }

    current++;

    document.getElementById("score").textContent=
    "Score: "+score;

    loadQuestion();
}

loadQuestion();

</script>

</body>
</html>
