<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Puku Blast - NITUL Games</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="game">

    <!-- TOP BAR -->
    <header class="topbar">

        <div class="game-title">
            🍬 PUKU BLAST
        </div>

        <button id="menuBtn" class="menu-btn">
            ☰
        </button>

        <div class="stats">

            <div class="stat">
                <span>SCORE</span>
                <strong id="score">0</strong>
            </div>

            <div class="stat">
                <span>MOVES</span>
                <strong id="moves">25</strong>
            </div>

            <div class="stat">
                <span>GOAL</span>
                <strong id="goal">0/30</strong>
            </div>

        </div>

    </header>


    <!-- LEVEL -->
    <section class="level-bar">

        <div class="stars">
            ★ ★ ★
        </div>

        <div class="level-title">
            LEVEL <span id="level">1</span>
        </div>

        <div class="progress">
            <div id="progress"></div>
        </div>

    </section>


    <!-- GAME BOARD -->
    <main class="game-area">

        <div id="board" class="board"></div>

    </main>


    <!-- BOOSTERS -->
    <section class="boosters">

        <button class="booster" data-type="hammer">
            🔨
            <span>6</span>
        </button>

        <button class="booster" data-type="rocket">
            🚀
            <span>4</span>
        </button>

        <button class="booster" data-type="bomb">
            💣
            <span>3</span>
        </button>

        <button class="booster" data-type="rainbow">
            🌈
            <span>2</span>
        </button>

        <button class="booster" data-type="shuffle">
            🔄
            <span>+</span>
        </button>

    </section>

</div>


<!-- POPUP -->
<div id="modal" class="modal show">

    <div class="popup">

        <div class="popup-icon">
            🧸
        </div>

        <h1 id="modalTitle">
            PUKU BLAST
        </h1>

        <p id="modalText">
            Match 3 or more candies, create powerful blasts
            and complete the level!
        </p>

        <button id="playBtn" class="play-btn">
            PLAY!
        </button>

    </div>

</div>


<script src="script.js"></script>

</body>
</html>
