<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NITUL Games - Street Racer</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #05050b;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            overflow: hidden;
        }

        h1 {
            margin: 15px 0 5px;
            color: #00eaff;
        }

        .score {
            font-size: 20px;
            margin-bottom: 10px;
        }

        #game {
            position: relative;
            width: 360px;
            height: 600px;
            max-width: 95vw;
            margin: auto;
            overflow: hidden;

            background:
                repeating-linear-gradient(
                    to bottom,
                    #333 0px,
                    #333 40px,
                    #444 40px,
                    #444 80px
                );

            border-left: 8px solid #00eaff;
            border-right: 8px solid #00eaff;
        }

        .road-line {
            position: absolute;
            width: 8px;
            height: 80px;
            background: white;
            left: 50%;
            transform: translateX(-50%);
        }

        .car {
            position: absolute;
            width: 50px;
            height: 90px;
            border-radius: 10px;
        }

        #player {
            bottom: 25px;
            left: 155px;
            background: linear-gradient(
                135deg,
                #00eaff,
                #0066ff
            );
            box-shadow: 0 0 20px #00eaff;
        }

        #player::after {
            content: "🏎️";
            font-size: 38px;
            position: absolute;
            top: 22px;
            left: 4px;
        }

        .enemy {
            background: linear-gradient(
                135deg,
                #ff2222,
                #990000
            );
        }

        .enemy::after {
            content: "🚗";
            font-size: 35px;
            position: absolute;
            top: 25px;
            left: 7px;
        }

        .controls {
            margin-top: 15px;
        }

        .controls button {
            width: 90px;
            height: 55px;
            margin: 5px;

            border: none;
            border-radius: 12px;

            background: #00eaff;
            color: #000;

            font-size: 25px;
            font-weight: bold;
            cursor: pointer;
        }

        #gameOver {
            display: none;

            position: absolute;
            inset: 0;

            background: rgba(0,0,0,0.85);

            align-items: center;
            justify-content: center;
            flex-direction: column;

            z-index: 20;
        }

        #gameOver h2 {
            color: #ff3333;
            font-size: 40px;
            margin-bottom: 15px;
        }

        #restart {
            padding: 14px 25px;

            border: none;
            border-radius: 8px;

            background: #00eaff;
            color: black;

            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<h1>🏎️ STREET RACER</h1>

<div class="score">
    Score: <span id="score">0</span>
</div>

<div id="game">

    <div class="road-line" style="top:0;"></div>
    <div class="road-line" style="top:160px;"></div>
    <div class="road-line" style="top:320px;"></div>
    <div class="road-line" style="top:480px;"></div>

    <div id="player" class="car"></div>

    <div id="gameOver">

        <h2>GAME OVER</h2>

        <p>Your Score:</p>

        <h3 id="finalScore">0</h3>

        <br>

        <button id="restart">
            🔄 RESTART
        </button>

    </div>

</div>

<div class="controls">

    <button id="left">⬅️</button>
    <button id="right">➡️</button>

</div>

<script>

const game = document.getElementById("game");
const player = document.getElementById("player");

const scoreText =
    document.getElementById("score");

const finalScore =
    document.getElementById("finalScore");

const gameOverScreen =
    document.getElementById("gameOver");

const restart =
    document.getElementById("restart");

let playerX = 155;
let score = 0;
let speed = 5;
let gameRunning = true;

let enemies = [];


// MOVE LEFT

function moveLeft() {

    if (!gameRunning) return;

    playerX -= 25;

    if (playerX < 10) {
        playerX = 10;
    }

    player.style.left =
        playerX + "px";
}


// MOVE RIGHT

function moveRight() {

    if (!gameRunning) return;

    playerX += 25;

    if (playerX > 292) {
        playerX = 292;
    }

    player.style.left =
        playerX + "px";
}


// KEYBOARD CONTROL

document.addEventListener(
    "keydown",
    function(e) {

        if (
            e.key === "ArrowLeft" ||
            e.key.toLowerCase() === "a"
        ) {
            moveLeft();
        }

        if (
            e.key === "ArrowRight" ||
            e.key.toLowerCase() === "d"
        ) {
            moveRight();
        }

    }
);


// MOBILE LEFT BUTTON

document.getElementById("left")
.addEventListener(
    "touchstart",
    function(e) {

        e.preventDefault();
        moveLeft();

    }
);


// MOBILE RIGHT BUTTON

document.getElementById("right")
.addEventListener(
    "touchstart",
    function(e) {

        e.preventDefault();
        moveRight();

    }
);


// ALSO SUPPORT MOUSE CLICK

document.getElementById("left")
.addEventListener(
    "click",
    moveLeft
);

document.getElementById("right")
.addEventListener(
    "click",
    moveRight
);


// CREATE ENEMY

function createEnemy() {

    if (!gameRunning) return;

    const enemy =
        document.createElement("div");

    enemy.className =
        "car enemy";

    const lanes = [
        55,
        155,
        255
    ];

    const lane =
        lanes[
            Math.floor(
                Math.random() * lanes.length
            )
        ];

    enemy.style.left =
        lane + "px";

    enemy.style.top =
        "-100px";

    game.appendChild(enemy);

    enemies.push(enemy);
}


// COLLISION CHECK

function collision(a, b) {

    const r1 =
        a.getBoundingClientRect();

    const r2 =
        b.getBoundingClientRect();

    return !(
        r1.bottom < r2.top ||
        r1.top > r2.bottom ||
        r1.right < r2.left ||
        r1.left > r2.right
    );
}


// GAME LOOP

function gameLoop() {

    if (!gameRunning) return;

    enemies.forEach(
        function(enemy, index) {

            let top =
                parseInt(
                    enemy.style.top
                );

            top += speed;

            enemy.style.top =
                top + "px";


            // COLLISION

            if (
                collision(
                    player,
                    enemy
                )
            ) {

                endGame();

            }


            // ENEMY PASSED

            if (top > 650) {

                enemy.remove();

                enemies.splice(
                    index,
                    1
                );

                score++;

                scoreText.innerText =
                    score;


                // INCREASE SPEED

                if (
                    score % 10 === 0
                ) {

                    speed += 0.5;

                }

            }

        }
    );


    requestAnimationFrame(
        gameLoop
    );
}


// GAME OVER

function endGame() {

    gameRunning = false;

    finalScore.innerText =
        score;

    gameOverScreen.style.display =
        "flex";
}


// RESTART GAME

restart.addEventListener(
    "click",
    function() {

        enemies.forEach(
            function(enemy) {
                enemy.remove();
            }
        );

        enemies = [];

        playerX = 155;
        score = 0;
        speed = 5;

        player.style.left =
            playerX + "px";

        scoreText.innerText =
            "0";

        gameOverScreen.style.display =
            "none";

        gameRunning = true;

        gameLoop();

    }
);


// CREATE NEW ENEMY

setInterval(
    function() {

        if (gameRunning) {
            createEnemy();
        }

    },
    1000
);


// START GAME

gameLoop();

</script>

</body>
</html>
