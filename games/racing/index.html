<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>NITUL Games - Street Racer PRO</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#05050b;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
    overflow:hidden;
}

h1{
    color:#00eaff;
    margin:8px 0 3px;
    font-size:25px;
}

button{
    border:0;
    cursor:pointer;
}

.topbar{
    display:flex;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap;
    font-size:14px;
    margin:5px auto 7px;
}

.stat{
    background:#121222;
    padding:6px 9px;
    border-radius:7px;
    border:1px solid #24243b;
}

/* GAME */

#game{
    position:relative;
    width:360px;
    height:600px;
    max-width:95vw;
    margin:auto;
    overflow:hidden;
    background:#222;
    border-left:7px solid #00eaff;
    border-right:7px solid #00eaff;
}

/* SKY / SIDE */

.sky{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:
        linear-gradient(
            #152b55 0%,
            #253d61 35%,
            #24551e 36%,
            #153d14 100%
        );
}

/* ROAD */

.road{
    position:absolute;
    top:0;
    bottom:0;
    left:7%;
    width:86%;
    background:
        linear-gradient(
            90deg,
            #555 0%,
            #222 7%,
            #222 93%,
            #555 100%
        );
}

/* ROAD EDGES */

.road:before,
.road:after{
    content:"";
    position:absolute;
    top:0;
    height:100%;
    width:5px;
    background:#ddd;
}

.road:before{
    left:7%;
}

.road:after{
    right:7%;
}

/* LANE LINES */

.lane-line{
    position:absolute;
    width:6px;
    height:85px;
    background:white;
    z-index:2;
    opacity:.9;
}

.lineA{left:37%;top:-100px;}
.lineB{left:63%;top:100px;}
.lineC{left:37%;top:300px;}
.lineD{left:63%;top:500px;}

/* ROAD SIDE OBJECTS */

.tree,
.building{
    position:absolute;
    z-index:1;
}

.tree{
    width:22px;
    height:22px;
    border-radius:50%;
    background:#0b7a20;
}

.tree:after{
    content:"";
    position:absolute;
    width:7px;
    height:20px;
    background:#75451f;
    left:8px;
    top:17px;
}

.building{
    width:38px;
    height:70px;
    background:#555;
    border:2px solid #222;
}

.building:after{
    content:"▦ ▦";
    color:#ffe66d;
    position:absolute;
    top:12px;
    left:5px;
    line-height:25px;
}

/* CARS */

.car{
    position:absolute;
    width:52px;
    height:88px;
    border-radius:12px;
    z-index:6;
}

#player{
    left:154px;
    bottom:28px;

    background:
        linear-gradient(
            90deg,
            #005cff,
            #00eaff,
            #005cff
        );

    border:2px solid white;

    box-shadow:
        0 0 18px #00eaff;
}

#player:before{
    content:"";
    position:absolute;
    width:30px;
    height:35px;
    background:#111;
    border-radius:8px;
    left:9px;
    top:8px;
}

#player:after{
    content:"";
    position:absolute;
    width:8px;
    height:12px;
    background:white;
    left:4px;
    bottom:7px;
    box-shadow:36px 0 white;
}

/* NITRO EFFECT */

#player.nitro{
    box-shadow:
        0 0 15px #00eaff,
        0 0 35px #ff9800;
}

#player.nitro .flame{
    display:block;
}

.flame{
    display:none;
    position:absolute;
    width:20px;
    height:35px;
    background:linear-gradient(#fff,#ff9800,red);
    bottom:-30px;
    left:15px;
    clip-path:polygon(50% 100%,0 0,100% 0);
}

/* ENEMY */

.enemy{
    background:
        linear-gradient(
            90deg,
            #8b0000,
            #ff3030,
            #8b0000
        );
    border:2px solid white;
}

.enemy:before{
    content:"";
    position:absolute;
    width:30px;
    height:35px;
    background:#111;
    border-radius:8px;
    left:9px;
    top:8px;
}

/* COIN */

.coin{
    position:absolute;
    width:28px;
    height:28px;
    border-radius:50%;
    background:#ffd700;
    border:3px solid #fff5a8;
    color:#754900;
    font-weight:bold;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:5;
    box-shadow:0 0 14px #ffd700;
}

/* OBSTACLE */

.obstacle{
    position:absolute;
    width:46px;
    height:32px;
    background:#ff8c00;
    border:3px solid white;
    border-radius:5px;
    z-index:5;
}

.obstacle:after{
    content:"⚠";
    font-size:20px;
    color:#111;
}

/* OVERLAYS */

.overlay{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.88);
    z-index:30;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    padding:20px;
}

.overlay.hidden{
    display:none;
}

.overlay h2{
    color:#00eaff;
    font-size:36px;
    margin-bottom:10px;
}

.overlay p{
    color:#ccc;
    margin:5px;
}

.main-btn{
    margin-top:18px;
    padding:14px 30px;
    border-radius:9px;
    background:#00eaff;
    color:#000;
    font-size:18px;
    font-weight:bold;
}

.secondary-btn{
    margin-top:10px;
    padding:10px 20px;
    border-radius:8px;
    background:#24243b;
    color:white;
}

/* CONTROLS */

.controls{
    margin-top:7px;
}

.controls button{
    width:75px;
    height:48px;
    margin:3px;
    border-radius:10px;
    background:#00eaff;
    color:#000;
    font-size:22px;
    font-weight:bold;
}

.controls .nitroBtn{
    background:#ff9800;
}

.controls .brakeBtn{
    background:#ff4444;
}

.tip{
    color:#777;
    font-size:11px;
    margin-top:3px;
}

/* AD READY */

.ad-area{
    position:absolute;
    left:50%;
    bottom:8px;
    transform:translateX(-50%);
    width:280px;
    height:45px;
    border:1px dashed #666;
    background:rgba(0,0,0,.5);
    color:#777;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:11px;
    z-index:10;
}

/* MOBILE */

@media(max-width:500px){

    #game{
        height:560px;
    }

    .topbar{
        gap:5px;
    }

    .stat{
        padding:5px 7px;
        font-size:12px;
    }

    .controls button{
        width:70px;
    }
}
</style>
</head>

<body>

<h1>🏎️ NITUL STREET RACER PRO</h1>

<div class="topbar">

    <div class="stat">
        🏆 <b id="score">0</b>
    </div>

    <div class="stat">
        💰 <b id="coins">0</b>
    </div>

    <div class="stat">
        ❤️ <b id="lives">3</b>
    </div>

    <div class="stat">
        🚦 LV <b id="level">1</b>
    </div>

    <div class="stat">
        ⚡ <b id="speedText">5</b>
    </div>

</div>


<div id="game">

    <div class="sky"></div>
    <div class="road"></div>

    <div class="lane-line lineA"></div>
    <div class="lane-line lineB"></div>
    <div class="lane-line lineC"></div>
    <div class="lane-line lineD"></div>

    <div id="player" class="car">
        <div class="flame"></div>
    </div>


    <!-- START -->

    <div id="startScreen" class="overlay">

        <h2>🏎️ STREET RACER</h2>

        <p>Welcome to NITUL Games</p>

        <p>🏆 Best Score:
            <b id="bestStart">0</b>
        </p>

        <p>
            Avoid traffic • Collect coins • Use Nitro
        </p>

        <button id="startBtn" class="main-btn">
            ▶ PLAY NOW
        </button>

        <button id="soundBtn" class="secondary-btn">
            🔊 SOUND ON
        </button>

    </div>


    <!-- PAUSE -->

    <div id="pauseScreen" class="overlay hidden">

        <h2>⏸️ PAUSED</h2>

        <button id="resumeBtn" class="main-btn">
            ▶ RESUME
        </button>

        <button id="pauseHomeBtn" class="secondary-btn">
            🏠 HOME
        </button>

    </div>


    <!-- GAME OVER -->

    <div id="gameOver" class="overlay hidden">

        <h2>💥 GAME OVER</h2>

        <p>🏆 Score:
            <b id="finalScore">0</b>
        </p>

        <p>💰 Coins:
            <b id="finalCoins">0</b>
        </p>

        <p>🏅 High Score:
            <b id="finalHigh">0</b>
        </p>

        <button id="restart" class="main-btn">
            🔄 PLAY AGAIN
        </button>

        <button id="homeBtn" class="secondary-btn">
            🏠 HOME
        </button>

    </div>


    <!-- ADVERTISEMENT READY -->

    <div class="ad-area">
        ADVERTISEMENT
    </div>

</div>


<div class="controls">

    <button id="left">⬅️</button>

    <button id="brake" class="brakeBtn">
        🛑
    </button>

    <button id="right">➡️</button>

    <button id="nitro" class="nitroBtn">
        ⚡
    </button>

    <button id="pause">
        ⏸️
    </button>

</div>

<div class="tip">
    PC: Arrow Keys / A-D | Mobile: Touch Buttons
</div>


<script>

/* =========================
   ELEMENTS
========================= */

const game =
document.getElementById("game");

const player =
document.getElementById("player");

const scoreText =
document.getElementById("score");

const coinsText =
document.getElementById("coins");

const livesText =
document.getElementById("lives");

const levelText =
document.getElementById("level");

const speedText =
document.getElementById("speedText");

const startScreen =
document.getElementById("startScreen");

const pauseScreen =
document.getElementById("pauseScreen");

const gameOver =
document.getElementById("gameOver");

const bestStart =
document.getElementById("bestStart");

const finalScore =
document.getElementById("finalScore");

const finalCoins =
document.getElementById("finalCoins");

const finalHigh =
document.getElementById("finalHigh");


/* =========================
   GAME VARIABLES
========================= */

let playerX = 154;

let score = 0;
let coins = 0;
let lives = 3;
let level = 1;

let speed = 5;

let running = false;
let paused = false;
let nitroActive = false;

let enemies = [];
let coinItems = [];
let obstacles = [];

let soundOn = true;

let highScore =
Number(
    localStorage.getItem(
        "nitulHighScore"
    )
) || 0;

bestStart.innerText =
highScore;


/* =========================
   SIMPLE SOUND
========================= */

let audioCtx = null;

function sound(freq,duration){

    if(!soundOn) return;

    try{

        if(!audioCtx){

            audioCtx =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

        }

        const osc =
        audioCtx.createOscillator();

        const gain =
        audioCtx.createGain();

        osc.frequency.value =
        freq;

        osc.connect(gain);

        gain.connect(
            audioCtx.destination
        );

        osc.start();

        gain.gain.exponentialRampToValueAtTime(
            0.001,
            audioCtx.currentTime + duration
        );

        osc.stop(
            audioCtx.currentTime + duration
        );

    }catch(e){}

}


/* =========================
   MOVEMENT
========================= */

function moveLeft(){

    if(!running || paused)
        return;

    playerX -= 30;

    if(playerX < 15)
        playerX = 15;

    player.style.left =
    playerX + "px";
}


function moveRight(){

    if(!running || paused)
        return;

    playerX += 30;

    if(playerX > 293)
        playerX = 293;

    player.style.left =
    playerX + "px";
}


/* =========================
   KEYBOARD
========================= */

document.addEventListener(
"keydown",
function(e){

    if(
        e.key === "ArrowLeft" ||
        e.key.toLowerCase() === "a"
    ){
        moveLeft();
    }

    if(
        e.key === "ArrowRight" ||
        e.key.toLowerCase() === "d"
    ){
        moveRight();
    }

    if(
        e.key.toLowerCase() === "p"
    ){
        togglePause();
    }

    if(
        e.code === "Space"
    ){
        activateNitro();
    }

});


/* =========================
   BUTTONS
========================= */

document.getElementById("left")
.addEventListener(
"click",
moveLeft
);

document.getElementById("right")
.addEventListener(
"click",
moveRight
);

document.getElementById("nitro")
.addEventListener(
"click",
activateNitro
);

document.getElementById("brake")
.addEventListener(
"click",
brake
);

document.getElementById("pause")
.addEventListener(
"click",
togglePause
);


/* =========================
   NITRO
========================= */

function activateNitro(){

    if(!running || paused)
        return;

    if(nitroActive)
        return;

    nitroActive = true;

    player.classList.add(
        "nitro"
    );

    speed += 5;

    sound(800,.15);

    setTimeout(
        function(){

            speed -= 5;

            nitroActive = false;

            player.classList.remove(
                "nitro"
            );

        },
        1800
    );
}


/* =========================
   BRAKE
========================= */

function brake(){

    if(!running || paused)
        return;

    speed = Math.max(
        3,
        speed - 2
    );

    setTimeout(
        function(){

            speed += 2;

        },
        800
    );
}


/* =========================
   COLLISION
========================= */

function collision(a,b){

    const r1 =
    a.getBoundingClientRect();

    const r2 =
    b.getBoundingClientRect();

    return !(
        r1.bottom < r2.top ||
        r1.top > r2.bottom ||
        r1.right < r2.left ||
        r1.left > r2.right
    );
}


/* =========================
   ENEMY
========================= */

function createEnemy(){

    if(!running || paused)
        return;

    const enemy =
    document.createElement("div");

    enemy.className =
    "car enemy";

    const lanes = [
        55,
        154,
        253
    ];

    const lane =
    lanes[
        Math.floor(
            Math.random() *
            lanes.length
        )
    ];

    enemy.style.left =
    lane + "px";

    enemy.style.top =
    "-100px";

    game.appendChild(enemy);

    enemies.push(enemy);
}


/* =========================
   COIN
========================= */

function createCoin(){

    if(!running || paused)
        return;

    const coin =
    document.createElement("div");

    coin.className =
    "coin";

    coin.innerText =
    "$";

    const lanes = [
        67,
        166,
        265
    ];

    const lane =
    lanes[
        Math.floor(
            Math.random() *
            lanes.length
        )
    ];

    coin.style.left =
    lane + "px";

    coin.style.top =
    "-40px";

    game.appendChild(coin);

    coinItems.push(coin);
}


/* =========================
   OBSTACLE
========================= */

function createObstacle(){

    if(!running || paused)
        return;

    const obstacle =
    document.createElement(
        "div"
    );

    obstacle.className =
    "obstacle";

    const lanes = [
        58,
        157,
        256
    ];

    obstacle.style.left =
    lanes[
        Math.floor(
            Math.random() *
            lanes.length
        )
    ] + "px";

    obstacle.style.top =
    "-50px";

    game.appendChild(
        obstacle
    );

    obstacles.push(
        obstacle
    );
}


/* =========================
   ROAD + ENVIRONMENT
========================= */

const lines =
document.querySelectorAll(
    ".lane-line"
);

function moveRoad(){

    lines.forEach(
    function(line){

        let top =
        parseInt(
            line.style.top ||
            getComputedStyle(
                line
            ).top
        );

        top += speed;

        if(top > 650)
            top = -100;

        line.style.top =
        top + "px";

    });
}


/* =========================
   SCORE / LEVEL
========================= */

function updateLevel(){

    level =
    Math.floor(
        score / 15
    ) + 1;

    levelText.innerText =
    level;

    if(
        score > 0 &&
        score % 15 === 0
    ){

        speed += .4;

    }

    speedText.innerText =
    speed.toFixed(1);
}


/* =========================
   GAME LOOP
========================= */

function gameLoop(){

    if(!running ||
       paused)
        return;

    moveRoad();


    /* ENEMIES */

    enemies.forEach(
    function(enemy,index){

        let top =
        parseInt(
            enemy.style.top
        );

        top += speed;

        enemy.style.top =
        top + "px";


        if(
            collision(
                player,
                enemy
            )
        ){

            enemy.remove();

            enemies.splice(
                index,
                1
            );

            lives--;

            livesText.innerText =
            lives;

            sound(100,.3);

            if(lives <= 0){

                endGame();

                return;

            }

        }


        if(top > 650){

            enemy.remove();

            enemies.splice(
                index,
                1
            );

            score++;

            scoreText.innerText =
            score;

            updateLevel();

        }

    });


    /* COINS */

    coinItems.forEach(
    function(coin,index){

        let top =
        parseInt(
            coin.style.top
        );

        top += speed;

        coin.style.top =
        top + "px";


        if(
            collision(
                player,
                coin
            )
        ){

            coin.remove();

            coinItems.splice(
                index,
                1
            );

            coins++;

            score += 5;

            coinsText.innerText =
            coins;

            scoreText.innerText =
            score;

            sound(900,.1);

            updateLevel();

        }


        if(top > 650){

            coin.remove();

            coinItems.splice(
                index,
                1
            );

        }

    });


    /* OBSTACLES */

    obstacles.forEach(
    function(obstacle,index){

        let top =
        parseInt(
            obstacle.style.top
        );

        top += speed;

        obstacle.style.top =
        top + "px";


        if(
            collision(
                player,
                obstacle
            )
        ){

            obstacle.remove();

            obstacles.splice(
                index,
                1
            );

            lives--;

            livesText.innerText =
            lives;

            sound(100,.3);

            if(lives <= 0){

                endGame();

                return;

            }

        }


        if(top > 650){

            obstacle.remove();

            obstacles.splice(
                index,
                1
            );

            score += 2;

            scoreText.innerText =
            score;

            updateLevel();

        }

    });


    requestAnimationFrame(
        gameLoop
    );
}


/* =========================
   START GAME
========================= */

function startGame(){

    startScreen.classList.add(
        "hidden"
    );

    pauseScreen.classList.add(
        "hidden"
    );

    gameOver.classList.add(
        "hidden"
    );

    clearObjects();

    playerX = 154;

    player.style.left =
    playerX + "px";

    score = 0;
    coins = 0;
    lives = 3;
    level = 1;
    speed = 5;

    scoreText.innerText =
    "0";

    coinsText.innerText =
    "0";

    livesText.innerText =
    "3";

    levelText.innerText =
    "1";

    speedText.innerText =
    "5";

    running = true;
    paused = false;

    sound(600,.15);

    gameLoop();
}


/* =========================
   GAME OVER
========================= */

function endGame(){

    running = false;

    if(score > highScore){

        highScore = score;

        localStorage.setItem(
            "nitulHighScore",
            highScore
        );

    }

    finalScore.innerText =
    score;

    finalCoins.innerText =
    coins;

    finalHigh.innerText =
    highScore;

    gameOver.classList.remove(
        "hidden"
    );
}


/* =========================
   CLEAR OBJECTS
========================= */

function clearObjects(){

    enemies.forEach(
        e => e.remove()
    );

    coinItems.forEach(
        c => c.remove()
    );

    obstacles.forEach(
        o => o.remove()
    );

    enemies = [];
    coinItems = [];
    obstacles = [];
}


/* =========================
   PAUSE
========================= */

function togglePause(){

    if(!running)
        return;

    paused =
    !paused;

    if(paused){

        pauseScreen.classList.remove(
            "hidden"
        );

    }else{

        pauseScreen.classList.add(
            "hidden"
        );

        gameLoop();

    }
}


/* =========================
   SOUND
========================= */

document.getElementById(
    "soundBtn"
)
.addEventListener(
"click",
function(){

    soundOn =
    !soundOn;

    this.innerText =
    soundOn
    ? "🔊 SOUND ON"
    : "🔇 SOUND OFF";

});


/* =========================
   HOME
========================= */

function goHome(){

    running = false;
    paused = false;

    clearObjects();

    pauseScreen.classList.add(
        "hidden"
    );

    gameOver.classList.add(
        "hidden"
    );

    startScreen.classList.remove(
        "hidden"
    );

    bestStart.innerText =
    highScore;
}


/* =========================
   START BUTTON
========================= */

document.getElementById(
    "startBtn"
)
.addEventListener(
    "click",
    startGame
);


/* =========================
   RESTART
========================= */

document.getElementById(
    "restart"
)
.addEventListener(
    "click",
    startGame
);


/* =========================
   RESUME
========================= */

document.getElementById(
    "resumeBtn"
)
.addEventListener(
    "click",
    togglePause
);


/* =========================
   HOME BUTTONS
========================= */

document.getElementById(
    "homeBtn"
)
.addEventListener(
    "click",
    goHome
);

document.getElementById(
    "pauseHomeBtn"
)
.addEventListener(
    "click",
    goHome
);


/* =========================
   SPAWN
========================= */

setInterval(
function(){

    if(running &&
       !paused){

        createEnemy();

    }

},
850
);


setInterval(
function(){

    if(running &&
       !paused){

        createCoin();

    }

},
1300
);


setInterval(
function(){

    if(running &&
       !paused &&
       Math.random() > .35){

        createObstacle();

    }

},
1800
);
