<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <meta name="theme-color" content="#4a1d6f">

    <title>Puku Blast | NITUL Games</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game-shell">

        <!-- BACKGROUND -->

        <div class="bg-candy candy-bg-1"></div>
        <div class="bg-candy candy-bg-2"></div>
        <div class="bg-candy candy-bg-3"></div>


        <!-- HEADER -->

        <header class="topbar">

            <button id="homeBtn" class="icon-btn" title="Back to Games">
                ←
            </button>


            <div class="brand">

                <div class="brand-small">
                    NITUL GAMES
                </div>

                <div class="brand-title">
                    <span>🍫</span>
                    PUKU BLAST
                </div>

            </div>


            <button id="menuBtn" class="icon-btn">
                ☰
            </button>

        </header>


        <!-- LEVEL -->

        <section class="level-panel">

            <div class="level-info">

                <div class="level-number">
                    LEVEL
                    <strong id="level">1</strong>
                </div>


                <div class="star-box">

                    <span id="star1">★</span>
                    <span id="star2">★</span>
                    <span id="star3">★</span>

                </div>

            </div>


            <div class="progress-track">

                <div id="progress" class="progress-fill"></div>

            </div>

        </section>


        <!-- STATS -->

        <section class="stats">

            <div class="stat-card">

                <span class="stat-icon">🏆</span>

                <div>
                    <small>SCORE</small>
                    <strong id="score">0</strong>
                </div>

            </div>


            <div class="stat-card moves-card">

                <span class="stat-icon">👣</span>

                <div>
                    <small>MOVES</small>
                    <strong id="moves">25</strong>
                </div>

            </div>


            <div class="stat-card">

                <span class="stat-icon">🎯</span>

                <div>
                    <small>GOAL</small>
                    <strong id="goal">0/30</strong>
                </div>

            </div>

        </section>


        <!-- OBJECTIVE -->

        <div class="objective">

            <span>🍬</span>

            <p>
                Match <strong>3 or more</strong> chocolates!
            </p>

        </div>


        <!-- GAME BOARD -->

        <main class="board-wrap">

            <div id="board" class="board"></div>

            <div id="comboText" class="combo-text"></div>

        </main>


        <!-- BOOSTERS -->

        <section class="boosters">

            <button class="booster" data-type="hammer">

                <span class="booster-icon">🔨</span>

                <small>HAMMER</small>

                <b>3</b>

            </button>


            <button class="booster" data-type="rocket">

                <span class="booster-icon">🚀</span>

                <small>ROCKET</small>

                <b>3</b>

            </button>


            <button class="booster" data-type="bomb">

                <span class="booster-icon">💣</span>

                <small>BOMB</small>

                <b>2</b>

            </button>


            <button class="booster" data-type="rainbow">

                <span class="booster-icon">🌈</span>

                <small>RAINBOW</small>

                <b>2</b>

            </button>

        </section>


        <!-- MENU PANEL -->

        <div id="menuPanel" class="side-menu">

            <div class="menu-card">

                <button id="closeMenu" class="close-menu">
                    ×
                </button>

                <h2>PAUSE MENU</h2>

                <button id="restartBtn">
                    🔄 Restart Level
                </button>

                <button id="soundBtn">
                    🔊 Sound On
                </button>

                <button id="menuHomeBtn">
                    🏠 Game Home
                </button>

            </div>

        </div>


        <!-- MODAL -->

        <div id="modal" class="modal show">

            <div class="modal-card">

                <div id="modalIcon" class="modal-icon">
                    🍫
                </div>

                <h1 id="modalTitle">
                    PUKU BLAST
                </h1>

                <p id="modalText">
                    Match delicious chocolates and create powerful combos!
                </p>

                <div id="modalStars" class="modal-stars">
                    ★ ★ ★
                </div>

                <button id="playBtn" class="main-btn">
                    PLAY NOW
                </button>

            </div>

        </div>


        <!-- PARTICLES -->

        <div id="particles"></div>

    </div>


    <script src="script.js"></script>

</body>

</html>
