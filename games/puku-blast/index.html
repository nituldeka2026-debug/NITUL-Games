<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Puku Blast - Magical Match 3</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    color:white;
    background:
        radial-gradient(circle at top,#6650b8 0,#292651 42%,#111329 100%);
}

button{
    font:inherit;
}

.app{
    width:100%;
    max-width:650px;
    margin:auto;
    padding:12px;
}

/* HEADER */

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
}

.logo{
    font-size:26px;
    font-weight:900;
}

.logo span{
    color:#ffd84d;
}

.coins{
    background:#292c50;
    border:1px solid #666b99;
    border-radius:20px;
    padding:8px 14px;
    font-weight:bold;
}

/* VILLAGE */

.village{
    padding:18px;
    border-radius:25px;
    background:
        linear-gradient(135deg,#8b5ed7,#397ed1);
    box-shadow:0 12px 30px #0005;
}

.village h1{
    margin:0;
    font-size:25px;
}

.village p{
    margin:5px 0 0;
    color:#e8eaff;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-top:15px;
}

.stat{
    background:#14172baa;
    border:1px solid #ffffff22;
    border-radius:14px;
    text-align:center;
    padding:8px;
}

.stat b{
    display:block;
    font-size:19px;
}

.stat small{
    color:#bfc5e7;
}

/* GAME */

.game{
    margin-top:12px;
    padding:13px;
    border-radius:25px;
    background:#25294a;
    border:1px solid #565c87;
}

.game-info{
    display:flex;
    justify-content:space-between;
    margin-bottom:10px;
    font-size:14px;
}

.game-info b{
    color:#ffd84d;
}

.board{
    width:min(94vw,540px);
    aspect-ratio:1;
    margin:auto;

    display:grid;
    grid-template-columns:repeat(8,1fr);
    gap:5px;

    padding:7px;

    border-radius:18px;

    background:#101329;
    box-shadow:inset 0 0 20px #0008;
}

.cell{
    position:relative;

    border:0;
    border-radius:11px;

    display:grid;
    place-items:center;

    cursor:pointer;

    background:#34395e;

    box-shadow:
        inset 0 -4px 0 #0003,
        0 2px 4px #0005;

    transition:.12s;
}

.cell:active{
    transform:scale(.88);
}

.cell.selected{
    outline:3px solid white;
    transform:scale(1.08);
    z-index:2;
}

/* GEMS */

.gem{
    width:68%;
    height:68%;

    border-radius:
        45% 55% 50% 50% /
        55% 45% 55% 45%;

    box-shadow:
        inset 4px 4px 8px #ffffff55,
        inset -5px -5px 8px #0003,
        0 3px 5px #0005;
}

.c0 .gem{
    background:#ff5f7b;
}

.c1 .gem{
    background:#54b7ff;
}

.c2 .gem{
    background:#ffd34d;
}

.c3 .gem{
    background:#76df70;
}

.c4 .gem{
    background:#b87cff;
}

.c5 .gem{
    background:#ff9751;
}

/* SPECIAL */

.special{
    position:absolute;
    font-size:25px;
    z-index:3;
}

.rocket{
    animation:rocketPulse .8s infinite alternate;
}

.rainbow{
    animation:rainbowPulse .8s infinite alternate;
}

@keyframes rocketPulse{
    from{transform:scale(.9)}
    to{transform:scale(1.15)}
}

@keyframes rainbowPulse{
    from{transform:rotate(-8deg) scale(.9)}
    to{transform:rotate(8deg) scale(1.15)}
}

/* OBSTACLES */

.ice::after{
    content:"❄️";
    position:absolute;
    font-size:22px;
}

.stone::after{
    content:"◆";
    color:#777d98;
    font-size:23px;
    position:absolute;
}

.locked::after{
    content:"🔒";
    font-size:19px;
    position:absolute;
}

/* MESSAGE */

.message{
    text-align:center;
    min-height:25px;
    margin-top:8px;
    color:#dfe4ff;
    font-size:14px;
}

/* BUTTONS */

.controls{
    display:flex;
    gap:8px;
    margin-top:10px;
}

.controls button{
    flex:1;

    border:0;
    border-radius:14px;

    padding:11px;

    font-weight:bold;

    background:#3b426d;
    color:white;
}

.controls button:first-child{
    background:#ffd84d;
    color:#292331;
}

/* MAP */

.map{
    margin-top:12px;

    padding:15px;

    background:#25294a;
    border:1px solid #565c87;

    border-radius:25px;
}

.map h2{
    margin:0 0 12px;
    font-size:18px;
}

.levels{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:8px;
}

.level{
    border:0;
    border-radius:14px;

    padding:10px 4px;

    background:#373d67;
    color:white;

    font-weight:bold;
}

.level.current{
    background:#8c61d7;
    box-shadow:0 0 0 2px #ffd84d;
}

.level.done{
    background:#438257;
}

.level.locked{
    opacity:.4;
}

/* OVERLAY */

.overlay{
    position:fixed;
    inset:0;

    display:none;
    place-items:center;

    background:#0009;

    padding:20px;

    z-index:100;
}

.modal{
    width:100%;
    max-width:400px;

    text-align:center;

    padding:25px;

    border-radius:25px;

    background:#272b4d;
    border:1px solid #7077a5;

    box-shadow:0 20px 70px #000;
}

.modal h2{
    margin-top:0;
    font-size:29px;
}

.modal button{
    border:0;
    border-radius:14px;

    padding:12px 28px;

    background:#ffd84d;

    font-weight:bold;
}

/* MOBILE */

@media(max-width:400px){

    .app{
        padding:8px;
    }

    .board{
        gap:3px;
        padding:5px;
    }

    .cell{
        border-radius:7px;
    }

    .levels{
        gap:5px;
    }

    .village h1{
        font-size:22px;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- HEADER -->

    <div class="header">

        <div class="logo">
            🌈 Puku <span>Blast</span>
        </div>

        <div class="coins">
            🪙 <span id="coins">120</span>
        </div>

    </div>


    <!-- VILLAGE -->

    <section class="village">

        <h1>
            🏡 Puku's Magical Village
        </h1>

        <p>
            Match gems, create boosters and restore the village!
        </p>

        <div class="stats">

            <div class="stat">
                <b id="level">1</b>
                <small>Level</small>
            </div>

            <div class="stat">
                <b id="score">0</b>
                <small>Score</small>
            </div>

            <div class="stat">
                <b id="best">0</b>
                <small>Best</small>
            </div>

        </div>

    </section>


    <!-- GAME -->

    <section class="game">

        <div class="game-info">

            <div>
                🎯 Target:
                <b id="target">900</b>
            </div>

            <div>
                Moves:
                <b id="moves">25</b>
            </div>

        </div>


        <div id="board" class="board"></div>


        <div id="message" class="message">
            Tap two adjacent gems to swap.
        </div>


        <div class="controls">

            <button id="shuffle">
                🔄 Shuffle
            </button>

            <button id="booster">
                🚀 Blast
                <span id="boosters">3</span>
            </button>

        </div>

    </section>


    <!-- LEVEL MAP -->

    <section class="map">

        <h2>
            🗺️ Puku Village Map
        </h2>

        <div id="levels" class="levels"></div>

    </section>

</div>


<!-- MODAL -->

<div id="overlay" class="overlay">

    <div class="modal">

        <h2 id="modalTitle"></h2>

        <p id="modalText"></p>

        <button id="modalButton">
            Continue
        </button>

    </div>

</div>


<script>

/* =====================================================
   PUKU BLAST
   SINGLE FILE GAME ENGINE
===================================================== */

const SIZE = 8;
const COLORS = 6;


/* GAME DATA */

let board = [];

let selected = null;

let moves = 25;

let score = 0;

let level = 1;

let coins =
    Number(localStorage.getItem("pukuCoins")) || 120;

let boosters =
    Number(localStorage.getItem("pukuBoosters")) || 3;

let best =
    Number(localStorage.getItem("pukuBest")) || 0;

let completed =
    Number(localStorage.getItem("pukuLevel")) || 0;


/* HELPERS */

function $(id){
    return document.getElementById(id);
}


function randomColor(){

    return Math.floor(
        Math.random() * COLORS
    );

}


/* LEVEL SETTINGS */

function levelData(l){

    return {

        target:
            700 + (l * 200),

        moves:
            Math.max(
                15,
                27 - Math.floor(l / 6)
            ),

        obstacles:
            Math.min(
                12,
                Math.floor(l / 3)
            )

    };

}


/* CREATE BOARD */

function createBoard(){

    board =
        Array.from(
            {length:SIZE},
            () =>
                Array.from(
                    {length:SIZE},
                    () => ({
                        color:randomColor(),
                        obstacle:null,
                        special:null
                    })
                )
        );


    /* ADD OBSTACLES */

    const obstacleCount =
        levelData(level).obstacles;


    let created = 0;

    while(created < obstacleCount){

        const x = Math.floor(
            Math.random() * SIZE
        );

        const y = Math.floor(
            Math.random() * SIZE
        );


        if(
            !board[y][x].obstacle &&
            x !== 0 &&
            y !== 0
        ){

            board[y][x].obstacle =
                Math.random() < .65
                    ? "ice"
                    : "stone";

            created++;

        }

    }


    /* REMOVE STARTING MATCHES */

    let matches = findMatches();

    while(matches.length){

        matches.forEach(p => {

            board[p.y][p.x].color =
                randomColor();

        });

        matches = findMatches();

    }

}


/* FIND MATCHES */

function findMatches(){

    const found = new Map();


    /* HORIZONTAL */

    for(let y=0;y<SIZE;y++){

        let run = 1;

        for(let x=1;x<=SIZE;x++){

            const same =
                x < SIZE &&
                board[y][x].color ===
                board[y][x-1].color &&
                board[y][x].obstacle !== "stone" &&
                board[y][x-1].obstacle !== "stone";


            if(same){

                run++;

            }else{

                if(run >= 3){

                    for(
                        let k=x-run;
                        k<x;
                        k++
                    ){

                        found.set(
                            k+","+y,
                            {x:k,y:y}
                        );

                    }

                }

                run=1;

            }

        }

    }


    /* VERTICAL */

    for(let x=0;x<SIZE;x++){

        let run=1;

        for(let y=1;y<=SIZE;y++){

            const same =
                y < SIZE &&
                board[y][x].color ===
                board[y-1][x].color &&
                board[y][x].obstacle !== "stone" &&
                board[y-1][x].obstacle !== "stone";


            if(same){

                run++;

            }else{

                if(run >= 3){

                    for(
                        let k=y-run;
                        k<y;
                        k++
                    ){

                        found.set(
                            x+","+k,
                            {x:x,y:k}
                        );

                    }

                }

                run=1;

            }

        }

    }


    return [...found.values()];

}


/* RENDER */

function render(){

    const boardElement =
        $("board");

    boardElement.innerHTML="";


    for(let y=0;y<SIZE;y++){

        for(let x=0;x<SIZE;x++){

            const tile =
                board[y][x];


            const cell =
                document.createElement("button");


            cell.className =
                "cell c"+tile.color;


            if(tile.obstacle){

                cell.classList.add(
                    tile.obstacle
                );

            }


            if(
                selected &&
                selected.x === x &&
                selected.y === y
            ){

                cell.classList.add(
                    "selected"
                );

            }


            const gem =
                document.createElement("span");

            gem.className="gem";

            cell.appendChild(gem);


            /* SPECIAL */

            if(tile.special){

                const special =
                    document.createElement("span");

                special.className =
                    "special";


                if(
                    tile.special === "rocket"
                ){

                    special.textContent="🚀";

                }

                if(
                    tile.special === "rainbow"
                ){

                    special.textContent="🌈";

                }


                cell.appendChild(
                    special
                );

            }


            cell.onclick =
                () => tileClick(x,y);


            boardElement.appendChild(
                cell
            );

        }

    }


    $("coins").textContent =
        coins;

    $("level").textContent =
        level;

    $("score").textContent =
        score;

    $("best").textContent =
        best;

    $("moves").textContent =
        moves;

    $("target").textContent =
        levelData(level).target;

    $("boosters").textContent =
        boosters;


    renderLevels();

}


/* TILE CLICK */

function tileClick(x,y){

    if(moves <= 0)
        return;


    if(
        board[y][x].obstacle === "stone"
    )
        return;


    if(!selected){

        selected={
            x:x,
            y:y
        };

        render();

        return;

    }


    const first =
        selected;

    const second =
        {x:x,y:y};


    selected=null;


    const distance =
        Math.abs(
            first.x-second.x
        )
        +
        Math.abs(
            first.y-second.y
        );


    if(distance !== 1){

        render();

        return;

    }


    swap(
        first,
        second
    );


    const matches =
        findMatches();


    if(!matches.length){

        swap(
            first,
            second
        );

        $("message").textContent =
            "❌ No match! Try another move.";

        render();

        return;

    }


    moves--;

    resolveMatches();

}


/* SWAP */

function swap(a,b){

    const temp =
        board[a.y][a.x];

    board[a.y][a.x] =
        board[b.y][b.x];

    board[b.y][b.x] =
        temp;

}


/* RESOLVE */

function resolveMatches(){

    let matches =
        findMatches();


    if(!matches.length){

        checkGameEnd();

        return;

    }


    const amount =
        matches.length;


    let specialCreated =
        null;


    /* 5+ = RAINBOW */

    if(amount >= 5){

        specialCreated =
            {
                ...matches[0],
                special:"rainbow"
            };

    }

    /* 4 = ROCKET */

    else if(amount === 4){

        specialCreated =
            {
                ...matches[0],
                special:"rocket"
            };

    }


    /* SCORE */

    const gained =
        amount * 100
        +
        (amount >= 4 ? 250 : 0);


    score += gained;


    /* CLEAR */

    matches.forEach(
        p => {

            const tile =
                board[p.y][p.x];


            /* ICE BREAK */

            if(
                tile.obstacle === "ice"
            ){

                tile.obstacle =
                    null;

            }


            tile.color=-1;

            tile.special=null;

        }
    );


    /* SPECIAL */

    if(specialCreated){

        const tile =
            board[
                specialCreated.y
            ][
                specialCreated.x
            ];


        tile.color =
            randomColor();


        tile.special =
            specialCreated.special;

    }


    $("message").textContent =
        "💥 "+amount+
        " match! +"+
        gained;


    collapse();


    render();


    setTimeout(
        () => {

            if(
                findMatches().length
            ){

                resolveMatches();

            }else{

                checkGameEnd();

            }

        },
        160
    );

}


/* COLLAPSE */

function collapse(){

    for(
        let x=0;
        x<SIZE;
        x++
    ){

        const items=[];


        for(
            let y=SIZE-1;
            y>=0;
            y--
        ){

            if(
                board[y][x].color !== -1
            ){

                items.push(
                    board[y][x]
                );

            }

        }


        for(
            let y=SIZE-1;
            y>=0;
            y--
        ){

            if(
                items[
                    SIZE-1-y
                ]
            ){

                board[y][x] =
                    items[
                        SIZE-1-y
                    ];

            }else{

                board[y][x]=
                    {
                        color:
                            randomColor(),
                        obstacle:null,
                        special:null
                    };

            }

        }

    }

}


/* BOOSTER */

$("booster").onclick =
function(){

    if(
        boosters <= 0 ||
        moves <= 0
    ){

        $("message").textContent =
            "No boosters available.";

        return;

    }


    boosters--;

    moves--;


    const x =
        Math.floor(
            Math.random()*SIZE
        );

    const y =
        Math.floor(
            Math.random()*SIZE
        );


    /* 3x3 BLAST */

    for(
        let dx=-1;
        dx<=1;
        dx++
    ){

        for(
            let dy=-1;
            dy<=1;
            dy++
        ){

            const xx=x+dx;

            const yy=y+dy;


            if(
                xx>=0 &&
                xx<SIZE &&
                yy>=0 &&
                yy<SIZE
            ){

                board[yy][xx].color=-1;

                board[yy][xx].obstacle=null;

                board[yy][xx].special=null;

            }

        }

    }


    score += 400;

    coins += 5;


    saveData();

    collapse();

    render();


    $("message").textContent =
        "🚀 Blast booster! +400";

};


/* SHUFFLE */

$("shuffle").onclick =
function(){

    if(moves<=0)
        return;


    moves--;

    createBoard();

    render();


    $("message").textContent =
        "🔄 Board shuffled!";

};


/* GAME END */

function checkGameEnd(){

    const target =
        levelData(level).target;


    if(score >= target){

        completed =
            Math.max(
                completed,
                level
            );


        coins += 30;


        best =
            Math.max(
                best,
                score
            );


        saveData();


        showModal(
            "🎉 Level Complete!",
            "Excellent! You earned 30 coins."
        );


        return;

    }


    if(moves <= 0){

        best =
            Math.max(
                best,
                score
            );


        saveData();


        showModal(
            "😮 Out of Moves",
            "Your score was "+score+
            ". Try again!"
        );

    }


    render();

}


/* LEVEL MAP */

function renderLevels(){

    const container =
        $("levels");

    container.innerHTML="";


    for(
        let i=1;
        i<=30;
        i++
    ){

        const button =
            document.createElement(
                "button"
            );


        button.className="level";


        if(i === level){

            button.classList.add(
                "current"
            );

        }


        if(i <= completed){

            button.classList.add(
                "done"
            );

            button.textContent =
                "✓ "+i;

        }

        else if(
            i > completed+1
        ){

            button.classList.add(
                "locked"
            );

            button.textContent =
                "🔒";

            button.disabled=true;

        }

        else{

            button.textContent =
                "⭐ "+i;

        }


        button.onclick =
            () => startLevel(i);


        container.appendChild(
            button
        );

    }

}


/* START LEVEL */

function startLevel(newLevel){

    level =
        newLevel;


    const data =
        levelData(level);


    moves =
        data.moves;


    score=0;

    selected=null;


    createBoard();

    render();


    $("message").textContent =
        "🎮 Level "+level+
        " started!";

}


/* SAVE */

function saveData(){

    localStorage.setItem(
        "pukuCoins",
        coins
    );

    localStorage.setItem(
        "pukuBoosters",
        boosters
    );

    localStorage.setItem(
        "pukuBest",
        best
    );

    localStorage.setItem(
        "pukuLevel",
        completed
    );

}


/* MODAL */

function showModal(
    title,
    text
){

    $("modalTitle").textContent =
        title;

    $("modalText").textContent =
        text;


    $("overlay").style.display =
        "grid";

}


/* MODAL BUTTON */

$("modalButton").onclick =
function(){

    $("overlay").style.display =
        "none";


    if(
        score >=
        levelData(level).target
    ){

        startLevel(
            level+1
        );

    }else{

        startLevel(
            level
        );

    }

};


/* INITIAL */

startLevel(1);

</script>

</body>
</html>
