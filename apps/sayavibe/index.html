<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0b14">

  <title>SAYAVIBE — Music & Lyrics</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <header class="topbar">
    <div class="brand">
      <div class="logo">S</div>
      <div>
        <h1>SAYAVIBE</h1>
        <span>Music • Lyrics • Vibe</span>
      </div>
    </div>

    <button id="themeBtn" class="icon-btn">☀️</button>
  </header>


  <main>

    <!-- Search -->
    <section class="search-area">
      <input
        id="searchInput"
        type="text"
        placeholder="Search songs..."
        autocomplete="off"
      >
    </section>


    <!-- Now Playing -->
    <section class="player">

      <div class="cover" id="cover">
        <div class="disc">S</div>
      </div>

      <div class="song-info">
        <h2 id="songTitle">SAYA VIBE</h2>
        <p id="artistName">SAYAVIBE Artist</p>
      </div>

      <div class="progress-area">
        <input
          id="progress"
          type="range"
          min="0"
          max="100"
          value="0"
        >

        <div class="time">
          <span id="currentTime">0:00</span>
          <span id="duration">0:00</span>
        </div>
      </div>

      <div class="controls">

        <button id="prevBtn">⏮</button>

        <button id="playBtn" class="play">
          ▶
        </button>

        <button id="nextBtn">⏭</button>

      </div>

      <button id="favBtn" class="favorite">
        ♡ Add to Favourite
      </button>

    </section>


    <!-- Lyrics -->
    <section class="lyrics-section">

      <div class="section-title">
        <h2>Lyrics</h2>
        <span id="lyricsStatus">Ready</span>
      </div>

      <div id="lyricsBox" class="lyrics-box">

        <p class="lyric active">Welcome to SAYAVIBE</p>
        <p class="lyric">Your music. Your lyrics.</p>
        <p class="lyric">Your own vibe.</p>

      </div>

    </section>


    <!-- Songs -->
    <section class="songs-section">

      <div class="section-title">
        <h2>🎵 Songs</h2>
      </div>

      <div id="songList" class="song-list"></div>

    </section>

  </main>


  <footer>
    <p>© 2026 SAYAVIBE</p>
    <span>Listen • Feel • Sing</span>
  </footer>


  <audio id="audio"></audio>

  <script src="js/app.js"></script>

</body>
</html>
