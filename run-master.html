<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Run Master - NITUL Games</title>

<style>
body{
    margin:0;
    background:#101820;
    color:white;
    font-family:Arial;
    text-align:center;
}
h1{margin:15px}

#game{
    width:360px;
    height:500px;
    margin:auto;
    position:relative;
    overflow:hidden;
    background:linear-gradient(#55cfff 0 60%,#3b3b3b 60%);
    border:3px solid white;
}

#player{
    position:absolute;
    bottom:30px;
    left:150px;
    font-size:45px;
}

.obstacle{
    position:absolute;
    bottom:30px;
    font-size:40px;
}

#score{
    font-size:20px;
    margin:10px;
}

button{
    margin:15px;
    padding:12px 25px;
    border:0;
    border-radius:10px;
}
</style>
</head>

<body>

<h1>🏃 Run Master</h1>

<div id="score">Score: 0</div>

<div id="game">
    <div id="player">🏃</div>
</div>

<button onclick="jump()">JUMP</button>
<button onclick="location.reload()">RESTART</button>

<script>

const game=document.getElementById("game");
const player=document.getElementById("player");
const scoreBox=document.getElementById("score");

let jumping=false;
let score=0;
let gameOver=false;

function jump(){

    if(jumping || gameOver)return;

    jumping=true;

    player.style.bottom="150px";

    setTimeout(()=>{
        player.style.bottom="30px";
        jumping=false;
    },500);
}

document.addEventListener("keydown",e=>{
    if(e.code==="Space" || e.code==="ArrowUp"){
        jump();
    }
});

function createObstacle(){

    if(gameOver)return;

    const o=document.createElement("div");
    o.className="obstacle";
    o.textContent="🪨";
    o.style.left="360px";

    game.appendChild(o);

    let x=360;

    const move=setInterval(()=>{

        if(gameOver){
            clearInterval(move);
            return;
        }

        x-=5;
        o.style.left=x+"px";

        const pr=player.getBoundingClientRect();
        const or=o.getBoundingClientRect();

        if(
            pr.left<or.right &&
            pr.right>or.left &&
            pr.top<or.bottom &&
            pr.bottom>or.top
        ){

            if(!jumping){

                gameOver=true;
                clearInterval(move);

                alert("Game Over! Score: "+score);
            }
        }

        if(x<-60){

            clearInterval(move);
            o.remove();

            score++;
            scoreBox.textContent="Score: "+score;
        }

    },30);
}

setInterval(createObstacle,1200);

</script>

</body>
</html>
